<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaMa-Testseite</title>
<!-- Schaltet "cross-origin isolation" frei, damit WASM mehrere Prozessorkerne nutzen darf -->
<script src="../coi-serviceworker.js"></script>
<style>
  :root { --bg: #f6f6f4; --fg: #1d1d1f; --muted: #6b6b70; --card: #fff; --line: #ddd; --accent: #2a62d8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161618; --fg: #f2f2f2; --muted: #a0a0a8; --card: #222226; --line: #3a3a40; --accent: #7aa2ff; }
  }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.note { color: var(--muted); margin: 0 0 16px; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; background: var(--card); margin: 0 0 12px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 2px; font-size: .85rem; color: var(--muted); }
  input[type=number] { width: 6em; }
  button { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  progress { width: 260px; }
  #status { font-family: ui-monospace, monospace; font-size: .85rem; white-space: pre-wrap; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .grid { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; align-items: flex-start; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  figure canvas, figure img { display: block; max-height: 520px; max-width: 100%; height: auto; }
  figcaption { font-size: .8rem; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<h1>LaMa-Testseite (Schritt 2)</h1>
<p class="note">Alles läuft lokal im Browser. Das Foto wird nicht hochgeladen, nur das KI-Modell wird einmalig von Hugging Face geladen.</p>

<fieldset>
  <label>Foto
    <select id="sample">
      <option value="samples/beach.jpg">Strand (3:4 hoch)</option>
      <option value="samples/forest.jpg">Waldweg (3:4 hoch, EXIF-gedreht)</option>
    </select>
  </label>
  <label>oder eigenes Foto <input type="file" id="file" accept="image/*"></label>
  <label>Zielbreite <input type="number" id="tw" value="1206"></label>
  <label>Zielhöhe <input type="number" id="th" value="2622"></label>
</fieldset>

<fieldset>
  <label>Rechenweg
    <select id="ep">
      <option value="webgpu">WebGPU (Grafikchip)</option>
      <option value="wasm">WASM (nur Prozessor)</option>
    </select>
  </label>
  <label>Prozessor-Threads <select id="threads"></select></label>
  <button id="btnLoad">1. Modell laden</button>
  <button id="btnRun" disabled>2. Rand füllen</button>
  <progress id="prog" max="1" value="0"></progress>
</fieldset>

<div id="status">Bereit.</div>
<div class="grid" id="out"></div>

<script type="module">
const MODEL_SIZE = 512;   // feste Eingabegröße von LaMa
const MASK_DILATE = 4;    // Maske ragt so viele Modell-Pixel ins Original (verhindert Kanten-Artefakte)
const FEATHER = 16;       // weicher Übergang in Ziel-Pixeln

const $ = (id) => document.getElementById(id);
const log = [];
function status(line) { log.push(line); $('status').textContent = log.join('\n'); window.__lamaLog = log; }

// Thread-Auswahl: automatisch = alle Kerne, dazu kleinere Werte zum Simulieren schwächerer Laptops
const cores = navigator.hardwareConcurrency || 4;
for (const n of [...new Set([cores, 4, 2, 1])]) {
  $('threads').add(new Option(n === cores ? `${n} (alle)` : String(n), n));
}

let worker = null;
let pending = null;

function startWorker() {
  worker?.terminate();
  worker = new Worker('lama-worker.js', { type: 'module' });
  worker.onmessage = ({ data }) => {
    if (data.type === 'progress') {
      $('prog').max = data.total; $('prog').value = data.loaded;
      if (data.phase === 'download' && data.loaded === data.total) status('Download fertig, wird im Browser-Cache gespeichert …');
      return;
    }
    if (data.type === 'warning') { status('WARNUNG: ' + data.message); return; }
    const p = pending; pending = null;
    if (data.type === 'error') p?.reject(new Error(data.message)); else p?.resolve(data);
  };
}

function call(msg, transfer = []) {
  return new Promise((resolve, reject) => { pending = { resolve, reject }; worker.postMessage(msg, transfer); });
}

$('btnLoad').onclick = async () => {
  $('btnLoad').disabled = $('btnRun').disabled = true;
  const ep = $('ep').value, threads = Number($('threads').value);
  status(`Lade Modell (${ep}, ${threads} Threads) … crossOriginIsolated=${self.crossOriginIsolated}`);
  startWorker();
  try {
    const r = await call({ type: 'init', ep, threads });
    status(`Modell bereit. Laden/Cache: ${(r.loadMs / 1000).toFixed(1)} s, Sitzung anlegen: ${(r.sessionMs / 1000).toFixed(1)} s`);
    status(`  Eingänge: ${r.inputNames.join(', ')} | Ausgang: ${r.outputNames.join(', ')} | Worker isoliert: ${r.crossOriginIsolated} | WebGPU vorhanden: ${r.hasWebGPU}`);
    $('btnRun').disabled = false;
  } catch (e) {
    status('FEHLER: ' + e.message);
  }
  $('btnLoad').disabled = false;
};

async function loadBitmap() {
  const f = $('file').files[0];
  const blob = f ?? await (await fetch($('sample').value)).blob();
  // imageOrientation 'from-image' dreht Handyfotos anhand der EXIF-Angabe richtig herum
  return createImageBitmap(blob, { imageOrientation: 'from-image' });
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingQuality = 'high';
  return [c, ctx];
}

function show(canvas, caption) {
  const fig = document.createElement('figure');
  fig.append(canvas);
  const cap = document.createElement('figcaption'); cap.textContent = caption; fig.append(cap);
  $('out').append(fig);
}

// Quadratische Fenster entlang der Lücken. Jedes Fenster enthält die Lücke plus angrenzendes Original als Kontext.
function windowsFor(W, H, rect) {
  const S = Math.min(W, H);
  const cx = Math.round(Math.min(Math.max(rect.x + rect.w / 2 - S / 2, 0), W - S));
  const cy = Math.round(Math.min(Math.max(rect.y + rect.h / 2 - S / 2, 0), H - S));
  const wins = [];
  if (rect.y > 0) wins.push({ x: cx, y: 0, S });
  if (rect.y + rect.h < H) wins.push({ x: cx, y: H - S, S });
  if (rect.x > 0) wins.push({ x: 0, y: cy, S });
  if (rect.x + rect.w < W) wins.push({ x: W - S, y: cy, S });
  const seen = new Set();
  return wins.filter((w) => { const k = `${w.x},${w.y}`; return !seen.has(k) && seen.add(k); });
}

$('btnRun').onclick = async () => {
  $('btnRun').disabled = true;
  $('out').innerHTML = '';
  try {
    const tStart = performance.now();
    const bmp = await loadBitmap();
    const W = Number($('tw').value), H = Number($('th').value);

    // 1. Original "contain" in die Zielfläche setzen
    const s = Math.min(W / bmp.width, H / bmp.height);
    const rect = { w: Math.round(bmp.width * s), h: Math.round(bmp.height * s) };
    rect.x = Math.round((W - rect.w) / 2); rect.y = Math.round((H - rect.h) / 2);
    const [base, bctx] = makeCanvas(W, H);
    bctx.drawImage(bmp, rect.x, rect.y, rect.w, rect.h);
    const fillShare = 1 - (rect.w * rect.h) / (W * H);
    status(`\nFoto ${bmp.width}×${bmp.height} → Ziel ${W}×${H}, Original ${rect.w}×${rect.h}, zu füllen: ${(fillShare * 100).toFixed(0)} %`);

    const [result, rctx] = makeCanvas(W, H);
    rctx.drawImage(base, 0, 0);

    const wins = windowsFor(W, H, rect);
    let inferMs = 0;
    for (const [i, win] of wins.entries()) {
      const { x, y, S } = win;
      const k = S / MODEL_SIZE;

      // 2. Fenster auf 512×512 verkleinern und Maske erzeugen
      const [mc, mctx] = makeCanvas(MODEL_SIZE, MODEL_SIZE);
      mctx.drawImage(base, x, y, S, S, 0, 0, MODEL_SIZE, MODEL_SIZE);
      const px = mctx.getImageData(0, 0, MODEL_SIZE, MODEL_SIZE).data;
      const N = MODEL_SIZE * MODEL_SIZE;
      const image = new Float32Array(3 * N), mask = new Float32Array(N);
      const d = MASK_DILATE * k;
      for (let j = 0; j < N; j++) {
        const gx = x + ((j % MODEL_SIZE) + 0.5) * k, gy = y + (Math.floor(j / MODEL_SIZE) + 0.5) * k;
        const inRect = gx >= rect.x && gx < rect.x + rect.w && gy >= rect.y && gy < rect.y + rect.h;
        // Maske nur an Kanten zu einer Lücke ins Original ausdehnen, nicht am Rand der Zielfläche
        const nearGap = (rect.x > 0 && gx < rect.x + d) || (rect.x + rect.w < W && gx >= rect.x + rect.w - d)
          || (rect.y > 0 && gy < rect.y + d) || (rect.y + rect.h < H && gy >= rect.y + rect.h - d);
        const known = inRect && !nearGap;
        mask[j] = known ? 0 : 1;
        for (let c = 0; c < 3; c++) image[c * N + j] = known ? px[j * 4 + c] / 255 : 0;
      }
      const maskView = mctx.getImageData(0, 0, MODEL_SIZE, MODEL_SIZE);
      for (let j = 0; j < N; j++) if (mask[j]) { maskView.data[j * 4] = 230; maskView.data[j * 4 + 1] = 40; maskView.data[j * 4 + 2] = 40; }
      mctx.putImageData(maskView, 0, 0);
      show(mc, `Fenster ${i + 1}: Modell-Eingabe 512×512 (rot = Maske)`);

      // 3. LaMa ausführen
      const r = await call({ type: 'run', image, mask, size: MODEL_SIZE }, [image.buffer, mask.buffer]);
      inferMs += r.ms;
      let max = 0; for (let j = 0; j < r.output.length; j += 97) max = Math.max(max, r.output[j]);
      const scale = max > 2 ? 1 : 255; // manche Exporte liefern 0..1, andere 0..255
      status(`Fenster ${i + 1} (${S}×${S} bei ${x},${y}): LaMa ${(r.ms / 1000).toFixed(2)} s, Ausgabe ${r.dims.join('×')}, Wertebereich bis ${max.toFixed(1)}`);

      const [oc, octx] = makeCanvas(MODEL_SIZE, MODEL_SIZE);
      const od = octx.createImageData(MODEL_SIZE, MODEL_SIZE);
      for (let j = 0; j < N; j++) {
        for (let c = 0; c < 3; c++) od.data[j * 4 + c] = r.output[c * N + j] * scale;
        od.data[j * 4 + 3] = 255;
      }
      octx.putImageData(od, 0, 0);
      show(oc, `Fenster ${i + 1}: LaMa-Ausgabe 512×512`);

      // 4. Auf Fenstergröße hochskalieren und nur Lücke + weichen Übergang übernehmen
      const [uc, uctx] = makeCanvas(S, S);
      uctx.drawImage(oc, 0, 0, S, S);
      const ud = uctx.getImageData(0, 0, S, S);
      for (let yy = 0; yy < S; yy++) {
        const gy = y + yy;
        for (let xx = 0; xx < S; xx++) {
          const gx = x + xx;
          let alpha = 1;
          if (gx >= rect.x && gx < rect.x + rect.w && gy >= rect.y && gy < rect.y + rect.h) {
            let dist = Infinity; // Abstand zur nächsten Lückenkante im Original
            if (rect.y > 0) dist = Math.min(dist, gy - rect.y);
            if (rect.y + rect.h < H) dist = Math.min(dist, rect.y + rect.h - 1 - gy);
            if (rect.x > 0) dist = Math.min(dist, gx - rect.x);
            if (rect.x + rect.w < W) dist = Math.min(dist, rect.x + rect.w - 1 - gx);
            alpha = Math.max(0, 1 - dist / FEATHER);
          }
          ud.data[(yy * S + xx) * 4 + 3] = Math.round(alpha * 255);
        }
      }
      uctx.putImageData(ud, 0, 0);
      rctx.drawImage(uc, x, y);
    }

    const totalMs = performance.now() - tStart;
    status(`LaMa gesamt: ${(inferMs / 1000).toFixed(2)} s, komplett inkl. Vor-/Nachbearbeitung: ${(totalMs / 1000).toFixed(2)} s`);

    const [prev, pctx] = makeCanvas(W, H);
    pctx.drawImage(base, 0, 0);
    show(prev, `Vorher: Original in Zielfläche (${W}×${H})`);
    show(result, `Ergebnis ${W}×${H}`);
    window.__lamaResult = result;
  } catch (e) {
    status('FEHLER: ' + e.message);
    console.error(e);
  }
  $('btnRun').disabled = false;
};

// Automatischer Durchlauf für Messungen: lama-test.html?auto=1&ep=wasm&threads=2&sample=forest&report=1
const q = new URLSearchParams(location.search);
if (q.has('auto') && self.crossOriginIsolated !== false) {
  if (q.has('ep')) $('ep').value = q.get('ep');
  if (q.has('threads')) { $('threads').add(new Option(q.get('threads'), q.get('threads'))); $('threads').value = q.get('threads'); }
  if (q.has('sample')) $('sample').value = `samples/${q.get('sample')}.jpg`;
  if (q.has('w')) $('tw').value = q.get('w');
  if (q.has('h')) $('th').value = q.get('h');
  await $('btnLoad').onclick();
  for (let i = 0; i < Number(q.get('runs') ?? 1); i++) await $('btnRun').onclick();
  if (q.has('report')) {
    await fetch('/report', { method: 'POST', body: JSON.stringify({
      name: q.toString(), ua: navigator.userAgent, log,
      result: window.__lamaResult?.toDataURL('image/jpeg', 0.92),
    }) });
  }
}
</script>
</body>
</html>
